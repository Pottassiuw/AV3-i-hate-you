name: Validar AV3
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greencode
          POSTGRES_PASSWORD: greencode
          POSTGRES_DB: greencode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greencode" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node -e "require('node:fs').copyFileSync('.env.example', '.env')"
      - run: npm ci
      - run: npm run setup
      - run: npm run demo:analytics
      - run: npm run demo:analytics
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
  portability:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node -e "require('node:fs').copyFileSync('.env.example', '.env')"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run test:unit
